services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    develop:
      watch:
        - path: ./package.json
          action: rebuild

        - path: ./next.config.js
          action: rebuild

        - path: ./package-lock.json
          action: rebuild

        - path: .
          target: /app
          action: sync
    environment:
      - DB_URL=mongodb://backend:27017/mydatabase
    volumes:
      - node_modules:/app/node_modules

volumes:
  node_modules:
